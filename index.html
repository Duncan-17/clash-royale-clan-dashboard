// Minimal CSV parser — handles quoted fields with commas inside.
// Returns a 2D array: rows[r][c] = string value.
function parseCSV(text) {
  const rows = [];
  const lines = text.split('\n');
  for (const line of lines) {
    if (!line.trim()) continue;
    const cols = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur.trim());
    rows.push(cols);
  }
  return rows;
}

// Fetch and parse a CSV sheet URL.
// Returns null on network error or if Google returns an HTML error page.
async function fetchCSV(url) {
  try {
    const resp = await fetch(url);
    if (!resp.ok) return null;
    const text = await resp.text();
    // Google Sheets returns an HTML error page when a sheet tab doesn't exist
    if (text.trim().startsWith('<')) return null;
    return parseCSV(text);
  } catch(e) {
    return null;
  }
}

// ══════════════════════════════════════════════════════
//  SHEET PARSERS / BUILDERS (v2 long-format schema)
//  Convert raw CSV 2D arrays into the structured state
//  (WARS, PLAYERS, WAR_STANDINGS, LIVE_SHEET_DATA) that
//  render() consumes — same shapes the old design used.
// ══════════════════════════════════════════════════════

// Strip Supercell color markup (<c6>name</c>) and trim. The API returns some
// names tagged, e.g. "<c6>Billitron" / "<c3>BabyJedi</c" — these must be cleaned
// or they silently break name-based matching between data sources.
function cleanName(name) {
  return String(name || '').replace(/<c\d+>/g, '').replace(/<\/c>?/g, '').trim();
}

// ── Parse WARS tab → ordered war registry ───────────────────────────────
// Columns: WAR_ID | CREATED_DATE | SEASON_ID | SECTION_INDEX | WAR_TYPE |
//          OUR_RANK | OUR_TROPHY_CHANGE | OUR_CLAN_FAME | FINALIZED_AT | SOURCE | NOTES
// Returns [{ id, label, warType, createdDate }] sorted by id ascending.
function parseWarsSheet(data) {
  if (!data || data.length < 2) return [];
  const out = [];
  for (let r = 1; r < data.length; r++) {
    const row = data[r];
    if (!row || row[0] === '' || row[0] == null) continue;
    const id = parseInt(row[0]);
    if (isNaN(id)) continue;
    out.push({ id, label: 'War ' + id, warType: (row[4] || 'normal'), createdDate: row[1] || '' });
  }
  out.sort((a, b) => a.id - b.id);
  return out;
}

// ── Pivot WAR_PLAYERS (long) → per-player score/deck arrays aligned to wars ──
// Columns: WAR_ID | PLAYER_TAG | PLAYER_NAME | FAME | DECKS_USED | BOAT_ATTACKS | SOURCE
// Keyed on PLAYER_TAG (stable across renames); display name = most-recent seen.
// A war's isAuto flag is set true iff ANY player has deck data for it (legacy
// migrated wars have no decks → isAuto=false → deck overlay shows "NA").
// Score semantics preserved from the old design: null = not in clan that war,
// 0 = in clan but played nothing.
function buildHistory(warsList, warPlayersData) {
  const warIndex = {};
  warsList.forEach((w, i) => { warIndex[w.id] = i; });
  const n = warsList.length;
  const warHasDecks = new Array(n).fill(false);
  const byKey = {};

  if (warPlayersData && warPlayersData.length > 1) {
    for (let r = 1; r < warPlayersData.length; r++) {
      const row = warPlayersData[r];
      if (!row || row[0] === '' || row[0] == null) continue;
      const warId = parseInt(row[0]);
      const col = warIndex[warId];
      if (col === undefined) continue;
      const tag = (row[1] || '').trim();
      const name = cleanName(row[2]);
      const fameRaw = row[3];
      const decksRaw = row[4];
      const fame = (fameRaw === '' || fameRaw == null) ? null : parseFloat(String(fameRaw).replace(/,/g, ''));
      const decks = (decksRaw === '' || decksRaw == null) ? null : parseInt(decksRaw);
      const key = tag || ('name:' + name.toLowerCase());
      if (!byKey[key]) byKey[key] = { name, tag, latestWar: -Infinity, scores: new Array(n).fill(null), decks: new Array(n).fill(null) };
      const rec = byKey[key];
      if (warId >= rec.latestWar) { rec.latestWar = warId; if (name) rec.name = name; }
      rec.scores[col] = (fame == null || isNaN(fame)) ? null : fame;
      if (decks != null && !isNaN(decks)) { rec.decks[col] = decks; warHasDecks[col] = true; }
    }
  }

  const wars = warsList.map((w, i) => ({ id: w.id, label: w.label, warType: w.warType, isAuto: warHasDecks[i], isLive: false }));
  const players = Object.keys(byKey).map(key => {
    const rec = byKey[key];
    return { name: rec.name, tag: rec.tag || '', pos: 'Member', scores: rec.scores, decks: rec.decks };
  });
  return { wars, players };
}

// ── Parse STANDINGS (v2 long) → { warId: [{clanTag,clanName,rank,trophyChange,fame,clanScore,isUs}] } ──
// Columns: WAR_ID | CLAN_TAG | CLAN_NAME | RANK | TROPHY_CHANGE | CLAN_FAME | CLAN_SCORE | IS_US | SOURCE
// NOTE: `fame` here is CLAN_FAME — boat-repair score on normal weeks, true fame on
// Colosseum weeks. It is used ONLY for placement/standings display, NEVER summed
// into the fame charts (those sum authoritative per-player WAR_PLAYERS fame).
function parseStandingsSheet(data) {
  if (!data || data.length < 2) return {};
  const result = {};
  for (let r = 1; r < data.length; r++) {
    const row = data[r];
    if (!row || row[0] === '' || row[0] == null) continue;
    const warId = String(parseInt(row[0]));
    if (warId === 'NaN') continue;
    const entry = {
      clanTag:      (row[1] || '').trim(),
      clanName:     cleanName(row[2]),
      rank:         parseInt(row[3]) || null,
      trophyChange: (row[4] === '' || row[4] == null) ? null : (parseInt(row[4]) || 0),
      fame:         parseInt(String(row[5] || '0').replace(/,/g, '')) || 0,
      clanScore:    parseInt(String(row[6] || '0').replace(/,/g, '')) || 0,
      isUs:         String(row[7] || '').trim().toUpperCase() === 'TRUE'
    };
    if (!result[warId]) result[warId] = [];
    result[warId].push(entry);
  }
  for (const w in result) result[w].sort((a, b) => (a.rank || 99) - (b.rank || 99));
  return result;
}

// Our clan's standings for a given war ID, or null.
function getOurStandingsForWar(warId) {
  const entries = WAR_STANDINGS[String(warId)];
  if (!entries) return null;
  return entries.find(e => e.isUs) || null;
}

// Adjust a war's rank for tie-for-1st: on a normal week, clan fame caps at
// NORMAL_WAR_FAME_CAP (the finish line). If we're AT the cap and so is
// whoever Supercell's riverracelog ranked #1, every number we can see says
// it's a tie -- Supercell's rank field just breaks it on some hidden
// criterion (likely time-to-cap) that isn't exposed to us. Treat it as 1st.
// Single source of truth so every rank display (Data tab war headers, Live
// tab summary box, anywhere else) agrees with each other.
function getAdjustedRank(standing, allStandingsForWar) {
  if (!standing) return null;
  let rank = standing.rank;
  if (rank && rank > 1 && allStandingsForWar && allStandingsForWar.length) {
    const rank1Entry = allStandingsForWar.find(e => e.rank === 1);
    if (rank1Entry && rank1Entry.fame === standing.fame && standing.fame >= NORMAL_WAR_FAME_CAP) {
      rank = 1;
    }
  }
  return rank;
}

// Our clan's standings for the most recent FINALIZED war (used on the Live page
// during training-day review, when the live API's clans[] has moved to the next race).
function getOurMostRecentStandings() {
  const finalizedWars = WARS.filter(w => !w.isLive);
  if (!finalizedWars.length) return null;
  const mostRecentFinalizedId = Math.max(...finalizedWars.map(w => w.id));
  const entry = getOurStandingsForWar(mostRecentFinalizedId);
  return entry ? { ...entry, warId: mostRecentFinalizedId } : null;
}

// ── Reconstruct LIVE_SHEET_DATA from SNAPSHOTS (v2 long) for the pending war ──
// Columns: TIMESTAMP | WAR_ID | PLAYER_TAG | PLAYER_NAME | CUM_FAME | CUM_DECKS |
//          DECKS_TODAY | BOAT_ATTACKS | PERIOD_INDEX | PERIOD_TYPE
// Produces the legacy contract the Live render expects, unchanged:
//   { lowerName: { name, days:[{decks,fame}×4], totalDecks, totalFame, counted } }
//   where days[d].decks = ISOLATED decks for war-day d (render sums them), and
//         days[d].fame  = CUMULATIVE fame THROUGH war-day d (render subtracts).
// War-days are grouped by PERIOD_INDEX (API increments it ~once/day); distinct
// periodIndexes sorted ascending → day 1..4. The end-of-day cumulative is the
// latest snapshot in each day bucket. `counted` implements the active-member
// rule for the avg-player metric: counted if present on day 1–2 OR any decks
// used; excluded only if first seen on day 3–4 with zero decks (locked-out late
// joiner). Falls back gracefully when snapshots are sparse.
function buildLiveFromSnapshots(data) {
  if (!data || data.length < 2) return {};
  let pending = -Infinity;
  const rows = [];
  for (let r = 1; r < data.length; r++) {
    const row = data[r];
    if (!row || row[1] === '' || row[1] == null) continue;
    const warId = parseInt(row[1]);
    if (isNaN(warId)) continue;
    rows.push(row);
    if (warId > pending) pending = warId;
  }
  if (!isFinite(pending)) return {};
  const live = rows.filter(row => parseInt(row[1]) === pending);
  if (!live.length) return {};

  const periods = Array.from(new Set(live.map(row => parseInt(row[8])).filter(p => !isNaN(p)))).sort((a, b) => a - b);
  const dayOfPeriod = {};
  periods.forEach((p, i) => { dayOfPeriod[p] = Math.min(i, WAR_DAYS - 1); });

  const byKey = {};
  // Track: for each period, the latest snapshot (for the day it belongs to)
  // AND the earliest snapshot (used as prior-day truth if next period started).
  // Key insight: if a player's battles land in the gap between the last hourly
  // snapshot of Day N and the first snapshot of Day N+1, the cumulative values
  // will appear in the earliest Day N+1 snapshot — which correctly reflects
  // the true end-of-Day-N state.
  const earliestByPeriod = {}; // key -> period -> {ts, cumFame, cumDecks}
  for (const row of live) {
    const tag = (row[2] || '').trim();
    const name = cleanName(row[3]);
    const key = tag || ('name:' + name.toLowerCase());
    const period = parseInt(row[8]);
    const day = (dayOfPeriod[period] != null) ? dayOfPeriod[period] : null;
    if (day === null) continue;
    const ts = String(row[0] || '');
    const cumFame = parseFloat(row[4]) || 0;
    const cumDecks = parseInt(row[5]) || 0;
    if (!byKey[key]) byKey[key] = { name, perDay: {} };
    if (name) byKey[key].name = name;
    const pd = byKey[key].perDay;
    // Latest snapshot of this period's day = most complete same-day picture
    if (!pd[day] || ts > pd[day].ts) pd[day] = { ts, cumFame, cumDecks };
    // Earliest snapshot per period — used below to backfill prior day
    if (!earliestByPeriod[key]) earliestByPeriod[key] = {};
    if (!earliestByPeriod[key][period] || ts < earliestByPeriod[key][period].ts) {
      earliestByPeriod[key][period] = { ts, cumFame, cumDecks };
    }
  }

  // Precise backfill: handle players who were present during Day D (appeared
  // in snapshots with 0 decks) but played their battles in the final window
  // before the period rolled over — too late for any Day D snapshot to catch them.
  //
  // Condition: player WAS seen during Day D (has snapshots for that period)
  //            AND their latest Day D cumDecks == 0
  //            AND earliest Day D+1 snapshot shows cumDecks > 0
  //
  // This correctly backfills Rahul (24 Day1 snapshots all showing 0, then 4
  // decks at the first Day2 snapshot = played in the final gap before rollover).
  //
  // It correctly EXCLUDES:
  //   - 神ET米尼拥 (had Day1 snapshots with decks > 0 — those Day1 decks are real)
  //   - "ABL„Yosif (never appeared in Day1 snapshots at all — not in war Day1)
  //
  // Track whether each player was seen during each period (had any snapshot)
  const seenInPeriod = {}; // key -> Set of periods
  for (const row of live) {
    const tag = (row[2] || '').trim();
    const name = cleanName(row[3]);
    const key = tag || ('name:' + name.toLowerCase());
    const period = parseInt(row[8]);
    if (!seenInPeriod[key]) seenInPeriod[key] = new Set();
    seenInPeriod[key].add(period);
  }

  for (const key in byKey) {
    const pd = byKey[key].perDay;
    const ep = earliestByPeriod[key] || {};
    const seen = seenInPeriod[key] || new Set();
    for (let d = 0; d < WAR_DAYS - 1; d++) {
      const thisPeriod = periods[d];
      const nextPeriod  = periods[d + 1];
      if (thisPeriod == null || nextPeriod == null) continue;
      // Player must have been seen during Day D (i.e. was in the war that day)
      if (!seen.has(thisPeriod)) continue;
      // Their latest Day D snapshot must show 0 decks
      if (pd[d] && pd[d].cumDecks > 0) continue;
      // Earliest Day D+1 snapshot must show decks > 0
      const earliest = ep[nextPeriod];
      if (!earliest || earliest.cumDecks === 0) continue;
      // All conditions met: player was present in Day D, showed 0 decks all day,
      // then appeared with decks at Day D+1 start = played in the final gap.
      pd[d] = { ts: earliest.ts, cumFame: earliest.cumFame, cumDecks: earliest.cumDecks };
    }
  }

  const result = {};
  for (const key in byKey) {
    const rec = byKey[key];
    const days = [];
    let prevCumDecks = 0, lastCumFame = 0, lastCumDecks = 0, firstDay = null;
    for (let d = 0; d < WAR_DAYS; d++) {
      const end = rec.perDay[d];
      if (end) {
        if (firstDay === null) firstDay = d;
        days.push({ decks: Math.max(0, end.cumDecks - prevCumDecks), fame: end.cumFame });
        prevCumDecks = end.cumDecks;
        lastCumFame = end.cumFame;
        lastCumDecks = end.cumDecks;
      } else {
        days.push({ decks: 0, fame: lastCumFame }); // carry cumulative forward, 0 isolated
      }
    }
    const counted = (firstDay !== null && firstDay <= 1) || lastCumDecks > 0;
    result[(rec.name || key).toLowerCase()] = { name: rec.name, days, totalDecks: lastCumDecks, totalFame: lastCumFame, counted };
  }
  return result;
}

// ── Append a live in-progress war column from the CR API (LIVE_DATA) ──────
// Mirrors the old WAR_N_LIVE column: always added when a war is active; the
// "include live" toggle controls visibility via effectiveWars() filtering isLive.
function appendLiveColumn() {
  const hasLive = Object.values(LIVE_DATA).some(p => (p.fame || 0) > 0 || (p.decksUsed || 0) > 0);
  if (!hasLive) return;
  const pendingId = (WARS.length ? Math.max(...WARS.map(w => w.id)) : 0) + 1;
  WARS.push({ id: pendingId, label: 'Live', warType: 'normal', isAuto: true, isLive: true });
  const col = WARS.length - 1;
  PLAYERS.forEach(p => { p.scores.push(null); p.decks.push(null); });
  const byName = {};
  PLAYERS.forEach(p => { byName[p.name.toLowerCase()] = p; });
  for (const k in LIVE_DATA) {
    const ld = LIVE_DATA[k];
    const nm = cleanName(ld.name);
    let p = byName[nm.toLowerCase()];
    if (!p) {
      p = { name: nm, tag: ld.tag || '', pos: 'Member', scores: new Array(col + 1).fill(null), decks: new Array(col + 1).fill(null) };
      PLAYERS.push(p);
      byName[nm.toLowerCase()] = p;
    }
    // Only assign a score if the player actually participated.
    // Non-participants (fame=0, decksUsed=0) stay null (shows as ·, not ✗).
    // A red ✗ means "was in clan, scored zero" — which shouldn't happen mid-war
    // for players who simply haven't been assigned yet.
    const participated = (ld.fame || 0) > 0 || (ld.decksUsed || 0) > 0;
    p.scores[col] = participated ? (ld.fame || 0) : null;
    p.decks[col]  = participated ? (ld.decksUsed || 0) : null;
  }
}

// ══════════════════════════════════════════════════════
//  CR API — fetch + parse Clash Royale clan data
// ══════════════════════════════════════════════════════

// Current clan member roles keyed by lowercase player name.
// Populated on each load/refresh from the CR API members endpoint.
let LIVE_ROLES = {};

// Fetch clan members (for current roles) and the live river race (for fame/decks)
// in parallel via the CF Worker proxy.
async function fetchClanData() {
  const tag = encodeURIComponent('#' + CLAN_TAG);
  const [membersResp, raceResp] = await Promise.all([
    fetch(`${CR_PROXY}/clans/${tag}/members`),
    fetch(`${CR_PROXY}/clans/${tag}/currentriverrace`)
  ]);
  const members = membersResp.ok ? await membersResp.json() : null;
  const race    = raceResp.ok    ? await raceResp.json()    : null;
  return { members, race };
}

// Convert the CR API members list into a { lowercaseName → displayRole } map.
function parseClanMembers(json) {
  const roleMap = { 'leader': 'Leader', 'coLeader': 'Co-leader', 'elder': 'Elder', 'member': 'Member' };
  const result = {};
  if (!json?.items) return result;
  for (const m of json.items) {
    const key = cleanName(m.name).toLowerCase();
    result[key] = roleMap[m.role] || 'Member';
  }
  return result;
}

// Convert the currentriverrace response into LIVE_DATA and populate LIVE_PARTICIPANTS.
// Each entry: { fame (cumulative), decksUsed (total war), decksUsedToday, tag, name }
function parseLiveWar(json) {
  const result = {};
  LIVE_PARTICIPANTS.clear();
  if (!json?.clan?.participants) return result;
  for (const p of json.clan.participants) {
    const nm  = cleanName(p.name);
    const key = nm.toLowerCase();
    result[key] = {
      fame:           p.fame           || 0,
      decksUsed:      p.decksUsed      || 0,
      decksUsedToday: p.decksUsedToday || 0,
      tag:  p.tag,
      name: nm
    };
    LIVE_PARTICIPANTS.add(key);
  }
  return result;
}

// Extract all clans competing in this week's river race (including us), sorted by
// fame descending. Used to compute our current placement/rank in the war.
// Each entry: { tag, name, fame, clanScore }
function parseRaceClans(json) {
  if (!json?.clans || !Array.isArray(json.clans)) return [];
  return [...json.clans]
    .map(c => ({ tag: c.tag, name: cleanName(c.name), fame: c.fame || 0, clanScore: c.clanScore || 0 }))
    .sort((a, b) => b.fame - a.fame);
}

// Returns our clan's 1-indexed rank (1st-5th) in the current river race, or null
// if race data isn't available.
function getOurRank() {
  if (!LIVE_RACE_CLANS.length) return null;
  const idx = LIVE_RACE_CLANS.findIndex(c => c.tag === ('#' + CLAN_TAG));
  return idx === -1 ? null : idx + 1;
}

// ══════════════════════════════════════════════════════
//  DERIVED STATS
//  All calculations treat scores arrays as:
//    null = player was NOT in the clan that war (excluded from averages)
//    0    = player was in clan but didn't play   (counts as 0 in averages)
// ══════════════════════════════════════════════════════

// Return the score slice for a given window size.
// n=0 means all-time; n>0 means the last N entries chronologically.
function getWindowScores(scores, n) {
  if (n === 0) return scores;
  return scores.slice(-n);
}

// Average fame over the window, excluding wars where the player wasn't in the clan.
function calcAvg(scores, n) {
  const window    = getWindowScores(scores, n);
  const clanWars  = window.filter(s => s !== null);
  if (!clanWars.length) return 0;
  return Math.round(clanWars.reduce((a, b) => a + b, 0) / clanWars.length);
}

// Participation rate = wars with score > 0 divided by wars in clan.
function calcParticipation(scores, n) {
  const window   = getWindowScores(scores, n);
  const clanWars = window.filter(s => s !== null);
  const attended = clanWars.filter(s => s > 0).length;
  return { attended, total: clanWars.length, pct: clanWars.length ? attended / clanWars.length : 0 };
}

// Average decks used per war (one decimal), excluding null (no data).
function calcAvgDecks(decks, n) {
  if (!decks) return null;
  const window   = getWindowScores(decks, n);
  const clanWars = window.filter(d => d !== null);
  if (!clanWars.length) return null;
  return Math.round(clanWars.reduce((a, b) => a + b, 0) / clanWars.length * 10) / 10;
}

// CSS class for coloring a deck count out of 16
function deckFracClass(d) {
  if (d === null) return 'deck-na';
  if (d >= 16)   return 'deck-full';
  if (d >= 12)   return 'deck-good';
  if (d >= 8)    return 'deck-mid';
  if (d > 0)     return 'deck-low';
  return 'deck-none';
}

// Method 1 Moving Average Trend (per AI recommendation):
// Respects warWindow: compares recent 1-2 wars against the prior wars WITHIN the window.
// Missed wars (null) are treated as 0 for trend purposes — absences should drag trend down.
// Threshold = ±300 points (≈ one missed war day).
function calcTrend(scores, n) {
  // Get the windowed slice (same data the player sees on screen)
  const windowed = n === 0 ? scores : scores.slice(-Math.max(n, 3));

  // For trend only: replace null (missed war) with 0 — absence is a performance hit
  // Players who weren't in clan yet (all nulls at start of history) are handled by
  // the < 3 non-zero guard below.
  const withMissed = windowed.map(s => s === null ? 0 : s);

  // Work most-recent-first
  const valid = [...withMissed].reverse();

  // Need at least 3 data points
  if (valid.length < 3) return 'flat';

  // If a player has never scored anything (brand new, all zeros), skip
  if (valid.every(s => s === 0)) return 'flat';

  // Recent window: last 1 war (smoothed to 2 if window is wide enough)
  const recentN   = Math.min(2, Math.floor(valid.length / 2));
  const recentAvg = valid.slice(0, recentN).reduce((a, b) => a + b, 0) / recentN;

  // Historic baseline: next wars after the recent window (up to 3)
  const baseSlice = valid.slice(recentN, recentN + 3);
  const baseAvg   = baseSlice.reduce((a, b) => a + b, 0) / baseSlice.length;

  // If baseline is essentially zero (player just joined), no signal yet
  if (baseAvg < 100) return 'flat';

  const diff = recentAvg - baseAvg;
  if (diff >  TREND_THRESHOLD) return 'up';
  if (diff < -TREND_THRESHOLD) return 'down';
  return 'flat';
}

// Returns true if the current live war has actually begun (at least one fame point scored).
// False means it's a training/preparation day — the river race exists but is empty.
function warHasStarted() {
  return Object.values(LIVE_DATA).some(p => p.fame > 0);
}

// Walk scores from most recent backwards to find the last war the player actually has data for.
function getLastWarScore(player) {
  for (let i = player.scores.length - 1; i >= 0; i--) {
    if (player.scores[i] !== null) return player.scores[i];
  }
  return null;
}

// A player is "inactive" if they don't appear in any recent war data.
// During an active war, presence in LIVE_PARTICIPANTS overrides everything.
// Otherwise: null in the most recent war column = not in the clan = inactive.
function isInactive(player) {
  const key = player.name.toLowerCase().trim();

  // Swapper accounts are never inactive — they rotate in/out by design
  if (SWAPPER_NAMES.has(key)) return false;

  if (warHasStarted()) {
    // Live war is running — anyone signed up is considered active
    if (LIVE_PARTICIPANTS.has(key)) return false;
  }

  if (!player.scores.length) return true;
  // null in the last score slot = player wasn't in the clan for the most recent war
  return player.scores[player.scores.length - 1] === null;
}

function promoRec(player, avg, part) {
  // Promotion recommendations disabled — re-enable when needed
  return '';
}

function avgClass(avg) {
  if (avg >= TIER_S) return 'avg-s';
  if (avg >= TIER_A) return 'avg-a';
  if (avg >= TIER_B) return 'avg-b';
  if (avg >= TIER_C) return 'avg-c';
  return 'avg-d';
}

// Green dot on data page: player is in the clan RIGHT NOW per live API, or is a designated swapper.
// ── SWAPPER / NEW / REMOVED player detection ────────────────────────────────
// SWAPPER = in SWAPPER_OVERRIDES (rotates in/out by design; takes priority
//           over NEW/REMOVED, matching the swapper bypass used elsewhere
//           in the app, e.g. isInactive() and isCurrentlyInClan()).
// NEW    = currently in LIVE_ROLES but has ≤ 1 qualifying war (just joined)
// REMOVED = NOT in LIVE_ROLES but was in the current live war (left/kicked mid-war)
function playerTag(p) {
  const key = p.name.toLowerCase().trim();

  if (SWAPPER_NAMES.has(key)) return 'swapper';

  // Only tag if LIVE_ROLES is actually populated (API worked and returned members).
  // If empty, we have no reliable roster data to judge against.
  const rosterLoaded = Object.keys(LIVE_ROLES).length > 10;

  const inRoster = !!LIVE_ROLES[key] || SWAPPER_NAMES.has(key);

  if (rosterLoaded && !inRoster) {
    // REMOVED: not in current roster AND was an active participant in this war.
    // Using LIVE_PARTICIPANTS only (reliable — comes directly from the live war API).
    // NOT using sheet fallback to avoid false positives on training day.
    if (LIVE_PARTICIPANTS.has(key)) return 'removed';
    return null;
  }

  if (inRoster) {
    // NEW: in roster but has ≤ 1 finalized war in history (just joined)
    const warsInHistory = p.scores.filter(s => s !== null).length;
    if (warsInHistory <= 1) return 'new';
  }

  return null;
}

function playerTagHtml(tag, style = 'badge') {
  if (!tag) return '';
  if (style === 'dot') {
    const color = tag === 'new' ? '#26c281' : tag === 'swapper' ? '#9b72cf' : '#e05252';
    const label = tag === 'new' ? 'NEW' : tag === 'swapper' ? 'SWAP' : 'OUT';
    return `<span style="display:inline-block;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:700;font-family:'Share Tech Mono',monospace;letter-spacing:1px;background:${color};color:#fff;margin-left:5px;vertical-align:middle">${label}</span>`;
  }
  // badge style
  const bg = tag === 'new' ? 'rgba(38,194,129,0.15)' : tag === 'swapper' ? 'rgba(155,114,207,0.15)' : 'rgba(224,82,82,0.15)';
  const border = tag === 'new' ? 'rgba(38,194,129,0.6)' : tag === 'swapper' ? 'rgba(155,114,207,0.6)' : 'rgba(224,82,82,0.6)';
  const color = tag === 'new' ? '#26c281' : tag === 'swapper' ? '#9b72cf' : '#e05252';
  const label = tag === 'new' ? '✦ NEW' : tag === 'swapper' ? '⇄ SWAP' : '✕ REMOVED';
  return `<span style="display:inline-block;padding:1px 6px;border-radius:3px;border:1px solid ${border};font-size:9px;font-weight:700;font-family:'Share Tech Mono',monospace;letter-spacing:1px;background:${bg};color:${color};margin-left:5px;vertical-align:middle">${label}</span>`;
}

// Green dot on data page: player is in the clan RIGHT NOW per live API, or is a designated swapper.
function isCurrentlyInClan(p) {
  const key = (p.name || '').toLowerCase().trim();
  // If LIVE_ROLES is populated (API worked), use it as the definitive source for both
  // regular members and swappers. Swappers rotate in/out, so check LIVE_ROLES for them too.
  // Only fall back to SWAPPER_NAMES when LIVE_ROLES is empty (API down).
  const rosterLoaded = Object.keys(LIVE_ROLES).length > 10;
  if (rosterLoaded) return !!LIVE_ROLES[key];
  // API down fallback: assume swappers are in clan, regular members unknown
  return SWAPPER_NAMES.has(key);
}

// isActive: used for data page active/inactive section split.
// A player is active if their last war score is non-null (was in clan for most recent war).
function isActive(p) {
  if (p.scores && p.scores.length > 0) return !isInactive(p);
  return isCurrentlyInClan(p);
}

function posClass(pos) {
  const map = { 'Leader':'pos-leader','Co-leader':'pos-coleader','Co-Leader':'pos-coleader','Elder':'pos-elder','Member':'pos-member','Swapper':'pos-swapper','Gone':'pos-gone' };
  return map[pos] || 'pos-member';
}

const ALL_SCORES_FLAT = [];

function heatClass(score) {
  if (score === null) return 'wc-absent';
  if (score === 0) return 'wc-0';
  if (!ALL_SCORES_FLAT.length) return 'wc-3';
  const max = Math.max(...ALL_SCORES_FLAT), min = Math.min(...ALL_SCORES_FLAT);
  const norm = (score - min) / (max - min || 1);
  if (norm >= 0.85) return 'wc-6';
  if (norm >= 0.70) return 'wc-5';
  if (norm >= 0.55) return 'wc-4';
  if (norm >= 0.40) return 'wc-3';
  if (norm >= 0.25) return 'wc-2';
  if (norm >= 0.10) return 'wc-1';
  return 'wc-0';
}

function calcAllWarsAvgDecks(p) {
  // Windowed avg decks — mirrors the Avg Battles column exactly (respects warWindow).
  const swScores = swapperAwareScores(p);
  const windowedScores = getWindowScores(swScores, warWindow);
  const windowOffset = swScores.length - windowedScores.length;
  const vals = windowedScores.map((s, wi) => {
    if (s === null) return null;
    const d = p.decks ? p.decks[windowOffset + wi] : null;
    return d !== null ? d : (s > 0 ? 16 : 0);
  }).filter(d => d !== null);
  return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : -1;
}

function sortPlayers(players) {
  return [...players].sort((a, b) => {
    // When battles toggled: primary = avg battles (all-time), secondary = active sortMode
    if (sortBattles) {
      const aD = calcAllWarsAvgDecks(a);
      const bD = calcAllWarsAvgDecks(b);
      if (Math.abs(bD - aD) > 0.05) return bD - aD; // primary: battles
      // fall through to secondary sort below
    }

    const aAvg = calcAvg(effectiveScores(a), warWindow);
    const bAvg = calcAvg(effectiveScores(b), warWindow);
    if (sortMode === 'avg') return bAvg - aAvg;
    if (sortMode === 'active') {
      const aOn = isCurrentlyInClan(a) ? 1 : 0, bOn = isCurrentlyInClan(b) ? 1 : 0;
      return aOn !== bOn ? bOn - aOn : bAvg - aAvg;
    }
    if (sortMode === 'alpha') return a.name.localeCompare(b.name);
    if (sortMode === 'part') return calcParticipation(swapperAwareScores(b), warWindow).pct - calcParticipation(swapperAwareScores(a), warWindow).pct;
    if (sortMode === 'role') {
      const rDiff = (ROLE_ORDER[a.pos] ?? 3) - (ROLE_ORDER[b.pos] ?? 3);
      return rDiff !== 0 ? rDiff : bAvg - aAvg;
    }
    return bAvg - aAvg; // default secondary: avg
  });
}

function filterPlayers() {
  // Inactive is purely auto-detected — no manual Gone tagging
  let inactive = PLAYERS.filter(p => isInactive(p));
  const inactiveNames = new Set(inactive.map(p => p.name.toLowerCase()));
  let active = PLAYERS.filter(p => !inactiveNames.has(p.name.toLowerCase()));

  if (searchStr) {
    const s = searchStr.toLowerCase();
    active = active.filter(p => p.name.toLowerCase().includes(s));
    inactive = inactive.filter(p => p.name.toLowerCase().includes(s));
  }

  return { active, inactive };
}

// ══════════════════════════════════════════════════════
//  RENDER — DATA MODE
// ══════════════════════════════════════════════════════
// Returns WARS filtered based on includeLive toggle
function effectiveWars() {
  return includeLive ? WARS : WARS.filter(w => !w.isLive);
}

// Returns player scores aligned to effectiveWars()
function effectiveScores(player) {
  if (includeLive) return player.scores;
  return player.scores.filter((_, i) => !WARS[i] || !WARS[i].isLive);
}

// For swapper players, treat 0-scored wars as null so participation/trend
// calculations don't penalise strategic non-participation.
function swapperAwareScores(player) {
  const scores = effectiveScores(player);
  if (!SWAPPER_NAMES.has(player.name.toLowerCase().trim())) return scores;
  return scores.map(s => s === 0 ? null : s);
}

function effectiveDecks(player) {
  if (includeLive) return player.decks;
  if (!player.decks) return player.decks;
  return player.decks.filter((_, i) => !WARS[i] || !WARS[i].isLive);
}

function buildWarHeaders() {
  const ew = effectiveWars();
  const shown = warWindow === 0 ? ew : ew.slice(-Math.max(warWindow, 3));
  return { shown, html: shown.map((w, i) => {
    const lbl = w.label || ('War ' + w.id);
    const standing = getOurStandingsForWar(w.id);
    const _rk = standing ? (getAdjustedRank(standing, WAR_STANDINGS[String(w.id)]) || 0) : 0;
    const _suf = _rk === 1 ? 'st' : _rk === 2 ? 'nd' : _rk === 3 ? 'rd' : 'th';
    const _emoji = _rk === 1 ? '🥇' : _rk === 2 ? '🥈' : _rk === 3 ? '🥉' : '';
    const placementHtml = standing
      ? `<div class="war-place place-${_rk}" style="font-size:8px;margin-top:2px;color:${_rk === 1 ? '#ffd700' : _rk === 2 ? '#c0c0c0' : _rk === 3 ? '#cd7f32' : 'var(--text-dim)'}"><i class="rb rb-${_rk}">${_emoji}</i> ${_rk}${_suf}</div>`
      : '';
    return `<th class="war-th">${lbl}${placementHtml}</th>`;
  }).join('') };
}

function buildRow(p, rank, isInactiveRow, shownWars) {
  const avg  = calcAvg(swapperAwareScores(p), warWindow);
  const part = calcParticipation(swapperAwareScores(p), warWindow);
  // Avg battles: respects warWindow — same window as avg/participation columns.
  // Uses swapper-aware scores so swapper zero wars are excluded.
  const swScores = swapperAwareScores(p);
  const windowedScores = getWindowScores(swScores, warWindow);
  const windowOffset = swScores.length - windowedScores.length;
  const allDecks = windowedScores.map((s, wi) => {
    if (s === null) return null;
    const d = p.decks ? p.decks[windowOffset + wi] : null;
    return d !== null ? d : (s > 0 ? 16 : 0);
  }).filter(d => d !== null);
  const avgDecks = allDecks.length ? allDecks.reduce((a,b)=>a+b,0)/allDecks.length : null;
  const avgDecksDisplay = avgDecks !== null ? (avgDecks).toFixed(1) + '/16' : '—';
  // Map avg decks to same color class as avg score for visual consistency
  // 16=avg-s, 14-15=avg-a, 12-13=avg-b, 8-11=avg-c, below=avg-d
  const avgDecksFracClass = avgDecks === null ? '' 
    : avgDecks >= 15.5 ? 'avg-s'
    : avgDecks >= 13.5 ? 'avg-a'
    : avgDecks >= 11.5 ? 'avg-b'
    : avgDecks >= 7.5  ? 'avg-c'
    : 'avg-d';
  const tr   = calcTrend(swapperAwareScores(p), warWindow);
  const promo = promoRec(p, avg, part);

  const partClass = part.pct >= PART_HIGH ? 'part-high' : part.pct >= PART_MID ? 'part-mid' : 'part-low';
  const trendHtml = tr === 'up'
    ? '<span class="trend-up">▲</span>'
    : tr === 'down'
    ? '<span class="trend-down">▼</span>'
    : '<span class="trend-flat"></span>';

  // War cells — align to WARS array
  const ew = effectiveWars();
  const warCells = shownWars.map(w => {
    const idx = WARS.findIndex(x => x.id === w.id);
    const ewIdx = ew.findIndex(x => x.id === w.id);
    const s = idx === -1 ? null : (p.scores[idx] ?? null);
    const d = (idx === -1 || !p.decks) ? null : (p.decks[idx] ?? null);
    const isRaw = idx !== -1 && !WARS[idx].isAuto;
    const isSwapperPlayer = SWAPPER_NAMES.has(p.name.toLowerCase().trim());
    const cls = heatClass(s);
    // Swappers show · for zero scores — presence without battling is by design
    const txt = s === null ? '·' : (s === 0 && isSwapperPlayer) ? '·' : s === 0 ? '✗' : s.toLocaleString();
    const effectiveCls = (s === 0 && isSwapperPlayer) ? 'wc-absent' : cls;
    // Deck fraction: only show when battles toggle is ON
    const deckHtml = !sortBattles ? ''
      : isRaw
        ? '<span class="deck-frac deck-na">NA</span>'
        : d !== null
          ? `<span class="deck-frac ${deckFracClass(d)}">${d}/16</span>`
          : '';
    const personalBest = Math.max(...p.scores.filter(s => s !== null && s > 0));
    const isPersonalBest = showPersonalBest && s !== null && s > 0 && s === personalBest;
    const inner = isPersonalBest ? `<span class="pb-num">${txt}</span>` : txt;
    return `<td class="wc ${effectiveCls}${isPersonalBest ? ' pb' : ''}"><span class="wcell">${inner}${deckHtml}</span></td>`;
  }).join('');

  return `<tr class="${isInactiveRow ? 'inactive-row' : ''}">
    <td class="td-rank">${rank}</td>
    <td><span class="player-name">${p.name}${playerTagHtml(playerTag(p))}</span>${promo}</td>
    <td style="white-space:nowrap"><span class="pos-badge ${posClass(p.pos)}">${p.pos}</span></td>
    <td class="td-active" style="text-align:center;min-width:65px">
      <span class="active-light ${isCurrentlyInClan(p) ? 'on' : 'off'}" title="${isCurrentlyInClan(p) ? 'In clan now' : 'Not in clan'}"></span>
    </td>
    <td class="td-part"><div class="part-row">
      <span class="part-pct">${Math.round(part.pct * 100)}%</span>
      <div class="part-bar-bg"><div class="part-bar-fill ${partClass}" style="width:${part.pct*100}%"></div></div>
    </div></td>
    <td class="td-trend">${trendHtml}</td>
    <td class="td-avg" style="text-align:center;white-space:nowrap"><span class="wcell ${avgDecksFracClass}">${avgDecksDisplay}</span></td>
    <td class="td-avg ${avgClass(avg)}"><span class="wcell">${avg > 0 ? avg.toLocaleString() : '—'}</span></td>
    ${warCells}
  </tr>`;
}

function buildSection(title, color, players, isInactiveSection, shownWars, warHeaderHtml) {
  if (!players.length) return '';
  const rows = players.map((p, i) => buildRow(p, i + 1, isInactiveSection, shownWars)).join('');
  return `<div class="section">
    <div class="section-hdr">
      <div class="section-stripe" style="background:${color}"></div>
      <div class="section-title">${title}</div>
      <div class="section-cnt">${players.length} members</div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr>
        <th>#</th><th>Player</th><th>Role</th>
        <th style="text-align:center">Active</th>
        <th>Participation</th><th style="text-align:center">Trend</th>
        <th style="text-align:center">Avg Battles</th>
        <th style="text-align:center">Avg (${warWindow === 0 ? 'All' : warWindow + 'W'})</th>
        ${warHeaderHtml}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

function renderData() {
  const { active, inactive } = filterPlayers();
  const { shown: shownWars, html: warHeaderHtml } = buildWarHeaders();

  let html = '';

  if (sortMode === 'role') {
    // Group by role, sub-sort by avg
    const sections = [
      { label: 'Leaders & Co-Leaders', color: 'var(--gold)',   filter: p => p.pos === 'Leader' || p.pos === 'Co-leader' || p.pos === 'Co-Leader' },
      { label: 'Elders',               color: 'var(--blue)',   filter: p => p.pos === 'Elder' },
      { label: 'Members',              color: 'var(--green)',  filter: p => p.pos === 'Member' },
      { label: 'Swappers',             color: 'var(--purple)', filter: p => p.pos === 'Swapper' },
    ];
    for (const sec of sections) {
      const sorted = sortPlayers(active.filter(sec.filter));
      if (sorted.length) html += buildSection(sec.label, sec.color, sorted, false, shownWars, warHeaderHtml);
    }
  } else {
    html += buildSection('Active Members', 'var(--gold)', sortPlayers(active), false, shownWars, warHeaderHtml);
  }

  // Inactive section — always a collapsible button, never a toggle
  if (inactive.length) {
    if (showInactive) {
      html += buildSection('Inactive / Former Members', 'var(--text-dim)', sortPlayers(inactive), true, shownWars, warHeaderHtml);
      html += `<button class="show-inactive-btn" onclick="toggleInactive()">▴ Hide Inactive Members</button>`;
    } else {
      html += `<button class="show-inactive-btn" onclick="toggleInactive()">▸ Show ${inactive.length} Inactive / Former Members</button>`;
    }
  }

  document.getElementById('main').innerHTML = html;
}

// Determine current war day from live API data.
// Uses the max total decks used across all participants:
//   decks 1–4 → Day 1,  5–8 → Day 2,  9–12 → Day 3,  13–16 → Day 4
// Returns 1 before anyone has played (pre-war or training day).
function computeCurrentDay(liveData) {
  const maxDecksUsed = Math.max(...Object.values(liveData).map(p => p.decksUsed || 0), 0);
  return maxDecksUsed === 0 ? 1 : Math.min(Math.ceil(maxDecksUsed / DECKS_PER_DAY), WAR_DAYS);
}
