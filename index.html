//  ANALYSIS MODE
// ══════════════════════════════════════════════════════

// Clan-wide all-time avg fame per participant per war (participants only, score > 0).
function clanAvgFamePerPlayer() {
  const nonLiveWars = WARS.filter(w => !w.isLive);
  const avgs = nonLiveWars.map(w => {
    const idx = WARS.indexOf(w);
    const scores = PLAYERS.map(p => p.scores[idx]).filter(s => s !== null && s > 0);
    return scores.length ? scores.reduce((a,b)=>a+b,0)/scores.length : null;
  }).filter(v => v !== null);
  return avgs.length ? avgs.reduce((a,b)=>a+b,0)/avgs.length : 2243;
}

// Clan-wide all-time avg decks per participant per war.
function clanAvgDecksPerPlayer() {
  const nonLiveWars = WARS.filter(w => !w.isLive);
  const avgs = nonLiveWars.map(w => {
    const idx = WARS.indexOf(w);
    const decks = PLAYERS.map(p => p.decks[idx]).filter(d => d !== null && d > 0);
    return decks.length ? decks.reduce((a,b)=>a+b,0)/decks.length : null;
  }).filter(v => v !== null);
  return avgs.length ? avgs.reduce((a,b)=>a+b,0)/avgs.length : 14;
}

// Per-player analytics — returns null if player has no qualifying data.
function calcPlayerAnalytics(p) {
  const nonLiveWars = WARS.filter(w => !w.isLive);
  const isSwapper = SWAPPER_NAMES.has(p.name.toLowerCase().trim());

  // Build per-war records, detecting mid-war joins
  let records = nonLiveWars.map((w, wi) => {
    const idx = WARS.indexOf(w);
    let score = p.scores[idx];
    let decks = p.decks[idx];
    // Wars 13-16 have no deck data (imported from old sheet with fame only).
    // If a player has a valid fame score but null decks, assume 16 — they
    // participated and scored, so they almost certainly used all their decks.
    if (decks === null && score !== null && score > 0) decks = 16;
    // Swappers: treat zero-scored wars as null — being present without battling
    // is strategic (covering another day), not negligence.
    if (isSwapper && score === 0) { score = null; decks = null; }
    return { warNum: w.id, score, decks };
  });

  // Find first non-null war (when player joined)
  const firstWarIdx = records.findIndex(r => r.score !== null || r.decks !== null);
  if (firstWarIdx === -1) return { qualifyingWars: 0, isSwapper };

  // Wars since joining
  const sinceJoining = records.slice(firstWarIdx);
  const totalWarsSinceJoining = sinceJoining.length;

  // Mid-war join detection: first 1-2 wars where decks < 4 are excluded
  let joinExcludeCount = 0;
  for (let i = 0; i < Math.min(2, sinceJoining.length); i++) {
    const r = sinceJoining[i];
    if (r.decks !== null && r.decks < 4) joinExcludeCount++;
    else break;
  }

  const qualifyingRecords = sinceJoining.slice(joinExcludeCount).filter(r => r.score !== null || r.decks !== null);
  const qualifyingWars = qualifyingRecords.length;
  const recentlyJoined = joinExcludeCount > 0 && qualifyingWars === 0;

  if (qualifyingWars === 0) return { qualifyingWars: 0, recentlyJoined: true, isSwapper };

  // Participation: wars with any decks played / total qualifying war slots
  const participated = qualifyingRecords.filter(r => (r.decks || 0) > 0 || (r.score || 0) > 0);
  const participationRate = qualifyingWars > 0 ? participated.length / qualifyingWars : 0;

  // Avg decks per war (only wars where player participated)
  const totalDecks = participated.reduce((a, r) => a + (r.decks || 0), 0);
  const avgDecksPerWar = participated.length > 0 ? totalDecks / participated.length : 0;

  // Avg fame per war (all qualifying wars including absences)
  const totalFame = qualifyingRecords.reduce((a, r) => a + (r.score || 0), 0);
  const avgFamePerWar = qualifyingWars > 0 ? totalFame / qualifyingWars : 0;

  // Avg fame per battle (deck)
  const avgFamePerBattle = totalDecks > 0 ? totalFame / totalDecks : 0;

  // Consistency: 1 - coefficient of variation of per-war fame scores (participated only)
  const fameScores = participated.map(r => r.score || 0);
  let consistency = 1;
  if (fameScores.length > 1) {
    const mean = fameScores.reduce((a,b)=>a+b,0)/fameScores.length;
    const variance = fameScores.reduce((a,b)=>a+(b-mean)**2,0)/fameScores.length;
    const cv = mean > 0 ? Math.sqrt(variance)/mean : 0;
    consistency = Math.max(0, 1 - cv);
  }

  return {
    qualifyingWars, totalWarsSinceJoining, recentlyJoined: false,
    participationRate, avgDecksPerWar, avgFamePerWar, avgFamePerBattle,
    consistency, isSwapper
  };
}

// ── Tenure gates ──────────────────────────────────────────────────────────
// A player can't be considered FOR a tier just because their score ranks
// them there -- they need enough wars under their belt for that trust to
// mean anything. These also double as the tenure-score normalization cap
// below (hitting the Co-Leader bar maxes out the tenure component).
const ELDER_MIN_WARS    = 8;
const COLEADER_MIN_WARS = 15;

// ── Value score (single source of truth for ranking + the on-card bar) ─────
// Weighted so that reliability -- wars played (tenure) and % of your 16
// battles/war you actually complete (deck usage) -- carries real weight
// alongside fame. Previously fame dominated (60% combined) and a highly
// consistent player who never misses a battle but scores under ~2k fame/war
// ranked below flashier, less reliable players. Now fame is 40% combined,
// and tenure + deck completion + participation (the "shows up and finishes
// their battles" stats) are 60% combined.
function calcValueScore(an, clanFameAvg, clanDecksAvg) {
  if (!an.qualifyingWars) return -1;
  const fb = clanDecksAvg > 0 ? clanFameAvg / clanDecksAvg : 1;
  const fameWarNorm    = clanFameAvg > 0 ? Math.min(an.avgFamePerWar / clanFameAvg, 1.5) : 0;
  const fameBattleNorm = fb > 0          ? Math.min(an.avgFamePerBattle / Math.max(fb, 1), 1.5) : 0;
  const decksNorm       = Math.min(an.avgDecksPerWar / 16, 1.0);              // % of their 16 battles/war actually played
  const tenureNorm      = Math.min(an.qualifyingWars / COLEADER_MIN_WARS, 1.0); // wars played -- reliability over time
  return fameWarNorm * 0.25
       + fameBattleNorm * 0.15
       + an.participationRate * 0.20
       + decksNorm * 0.20
       + tenureNorm * 0.20;
}

// Given a player's 0-indexed position in the value-score-sorted ranking
// (best first) and the total number of ranked players, return which role
// tier that rank position implies: top third -> Co-Leader, middle third ->
// Elder, bottom third -> Member.
function tierForRank(rankIdx, total) {
  if (!total) return null;
  const third = total / 3;
  if (rankIdx < third) return 'Co-Leader';
  if (rankIdx < third * 2) return 'Elder';
  return 'Member';
}

// Compute the promotion/demotion signal for a player.
// rankIdx/tierTotal: this player's 0-indexed position (and the total ranked
// count) within the value-score-sorted active roster -- see renderAnalysis.
function calcSignal(p, analytics, clanFameAvg, clanDecksAvg, rankIdx = null, tierTotal = 0) {
  const { qualifyingWars, participationRate, avgDecksPerWar,
          avgFamePerWar, avgFamePerBattle } = analytics;
  const role = p.pos || 'Member';

  // --- Kick zone: consistent low output + low deck usage ---
  // Primary signal: decks < 11/war (missing 5+ decks) AND fame/war < 75% clan avg
  // Must have 3+ wars to avoid false-flagging new players
  if (qualifyingWars >= 3 && avgDecksPerWar < 11 && avgFamePerWar < clanFameAvg * 0.75) {
    return { type: 'down-kick', label: '✕', alert: 'kick',
      tooltip: 'Kick zone — consistently low deck usage and output' };
  }
  // Secondary kick: very low participation sustained
  if (qualifyingWars >= 3 && participationRate < 0.35) {
    return { type: 'down-kick', label: '✕', alert: 'kick',
      tooltip: 'Kick zone — persistent absence from wars' };
  }

  // --- Warning zone: approaching kick thresholds ---
  if (qualifyingWars >= 3 && (
    avgDecksPerWar < 13 && avgFamePerWar < clanFameAvg * 0.85
  )) {
    return { type: 'neutral', label: '—', alert: 'warn',
      tooltip: 'Warning — low deck usage and below-average output' };
  }
  if (qualifyingWars >= 3 && participationRate < 0.55) {
    return { type: 'neutral', label: '—', alert: 'warn',
      tooltip: 'Warning — below acceptable participation rate' };
  }

  // --- Promotion / demotion: rank-position based, gated by tenure ---
  // The Active Members list is already sorted by value score, best first --
  // that ranking is treated as ground truth for WHO deserves consideration.
  // Split it into thirds and treat each third as this war's implied role
  // tier: top third Co-Leader, middle third Elder, bottom third Member.
  // But rank alone can't earn a tier the player hasn't put the time in for
  // -- Elder requires ELDER_MIN_WARS+ wars, Co-Leader requires
  // COLEADER_MIN_WARS+, regardless of score. A player who ranks into a tier
  // they're not yet tenured for is capped at the highest tier they qualify
  // for (this applies uniformly, so a current Co-Leader who's dropped below
  // COLEADER_MIN_WARS -- e.g. after a long absence -- is flagged for
  // demotion on tenure grounds too, not just score).
  // Signal color reflects the DESTINATION tier (blue = Elder, gold =
  // Co-Leader), not just "promotion" vs "demotion" generically.
  // Leader is a fixed single-person role and is never touched by this.
  const tierIndex = { 'Co-Leader': 0, 'Co-leader': 0, 'Elder': 1, 'Member': 2 };
  const tierNames = ['Co-Leader', 'Elder', 'Member'];
  if (role !== 'Leader' && rankIdx != null && tierTotal > 0 && role in tierIndex) {
    const rawTarget = tierForRank(rankIdx, tierTotal);
    const tenureCap = qualifyingWars >= COLEADER_MIN_WARS ? 'Co-Leader'
      : qualifyingWars >= ELDER_MIN_WARS ? 'Elder' : 'Member';
    const rawIdx  = tierIndex[rawTarget];
    const capIdx  = tierIndex[tenureCap];
    const cappedByTenure = capIdx > rawIdx;
    const targetIdx  = Math.max(rawIdx, capIdx); // more restrictive of the two wins
    const targetTier = tierNames[targetIdx];
    const roleIdx     = tierIndex[role];
    const tenureNote = cappedByTenure
      ? ` (capped by tenure — needs ${targetTier === 'Elder' ? COLEADER_MIN_WARS : ELDER_MIN_WARS}+ wars for the next tier, has ${qualifyingWars})`
      : '';
    if (targetIdx < roleIdx) {
      return targetTier === 'Co-Leader'
        ? { type: 'up-coleader', label: '▲', alert: null,
            tooltip: `Ranked #${rankIdx + 1} of ${tierTotal} by value score — top tier, promote to Co-Leader${tenureNote}` }
        : { type: 'up-elder', label: '▲', alert: null,
            tooltip: `Ranked #${rankIdx + 1} of ${tierTotal} by value score — top tier, promote to Elder${tenureNote}` };
    }
    if (targetIdx > roleIdx) {
      return targetTier === 'Member'
        ? { type: 'down-member', label: '▼', alert: null,
            tooltip: `Ranked #${rankIdx + 1} of ${tierTotal} by value score — bottom tier, demote to Member${tenureNote}` }
        : { type: 'down-elder', label: '▼', alert: null,
            tooltip: `Ranked #${rankIdx + 1} of ${tierTotal} by value score — middle tier, demote to Elder${tenureNote}` };
    }
  }

  return { type: 'neutral', label: '—', alert: null, tooltip: 'Consistent with current role' };
}

function renderAnalysis() {
  const clanFameAvg  = clanAvgFamePerPlayer();
  const clanDecksAvg = clanAvgDecksPerPlayer();
  const fameBattleAvg = clanDecksAvg > 0 ? clanFameAvg / clanDecksAvg : 0;

  // Main active = in LIVE_ROLES AND not a swapper
  // Main inactive = not in LIVE_ROLES AND not a swapper
  // Swapper section = ALL known swapper accounts (always shown, both views)
  const allSwappers    = PLAYERS.filter(p => SWAPPER_NAMES.has(p.name.toLowerCase().trim()));
  const nonSwappers    = PLAYERS.filter(p => !SWAPPER_NAMES.has(p.name.toLowerCase().trim()));
  const activePlayers  = nonSwappers.filter(p => !!LIVE_ROLES[p.name.toLowerCase().trim()]);
  const inactivePlayers= nonSwappers.filter(p => !LIVE_ROLES[p.name.toLowerCase().trim()]);
  const mainPlayers    = analysisFilter === 'active' ? activePlayers : inactivePlayers;

  // Compute analytics for main players, then sort by value score (best
  // first) -- this ranking is the single source of truth for both the
  // display order AND the rank-based promotion/demotion signal below.
  const mainWithAnalytics = mainPlayers
    .map(p => ({ p, analytics: calcPlayerAnalytics(p) }))
    .sort((a, b) => calcValueScore(b.analytics, clanFameAvg, clanDecksAvg) - calcValueScore(a.analytics, clanFameAvg, clanDecksAvg));

  // Rank position for the tier-based signal: only players with enough war
  // data to be meaningfully ranked (qualifyingWars > 0, not recentlyJoined)
  // count toward rank/tier boundaries -- brand-new players get the NEW
  // badge instead of a signal, same as before, and don't skew the thirds.
  const rankedForTiers = mainWithAnalytics.filter(e => e.analytics.qualifyingWars > 0 && !e.analytics.recentlyJoined);
  rankedForTiers.forEach((entry, idx) => {
    entry.signal = calcSignal(entry.p, entry.analytics, clanFameAvg, clanDecksAvg, idx, rankedForTiers.length);
  });

  // All swappers with analytics — sorted: in-clan first, then out-of-clan
  const swapperWithAnalytics = allSwappers
    .map(p => ({ p, analytics: calcPlayerAnalytics(p), inClan: !!LIVE_ROLES[p.name.toLowerCase().trim()] }))
    .sort((a, b) => (b.inClan ? 1 : 0) - (a.inClan ? 1 : 0));

  function signalHtml(signal, analytics, p) {
    if (analytics.qualifyingWars === 0 || analytics.recentlyJoined) {
      return `<div class="an-signal an-signal-new" title="Not enough war data yet">NEW</div>`;
    }
    if (!signal) return `<div class="an-signal an-signal-neutral" title="No signal">—</div>`;
    const cls = {
      'up-coleader': 'an-signal-up-coleader',
      'up-elder':    'an-signal-up-elder',
      'down-elder':  'an-signal-down-elder',
      'down-member': 'an-signal-down-member',
      'down-kick':   'an-signal-down-kick',
      'neutral':     'an-signal-neutral'
    }[signal.type] || 'an-signal-neutral';
    return `<div class="an-signal ${cls}" title="${signal.tooltip}">${signal.label}</div>`;
  }

  function valueBarHtml(analytics, isSwap = false) {
    if (analytics.qualifyingWars === 0 || analytics.recentlyJoined) return '';
    const { qualifyingWars, participationRate, avgDecksPerWar, avgFamePerWar, avgFamePerBattle } = analytics;
    const fb = clanDecksAvg > 0 ? clanFameAvg / clanDecksAvg : 1;

    // Swappers scored purely on fame/battle efficiency
    if (isSwap) {
      const v = avgFamePerBattle / Math.max(fb, 1);
      const pct = Math.min(v / 1.5 * 100, 100);
      const color = v >= 1.1 ? 'var(--green)' : v >= 0.85 ? 'var(--gold)' : v >= 0.6 ? 'var(--orange)' : 'var(--red)';
      return `<div class="an-value-bar-wrap">
        <div class="an-value-bar-bg"><div class="an-value-bar-fill" style="width:${pct.toFixed(1)}%;background:${color}"></div></div>
        <div class="an-value-lbl" style="color:${color}">${(v*100).toFixed(0)}</div>
      </div>`;
    }

    const v = calcValueScore(analytics, clanFameAvg, clanDecksAvg);
    const pct = Math.min(v / 1.5 * 100, 100);
    const color = v >= 1.1 ? 'var(--green)' : v >= 0.85 ? 'var(--gold)' : v >= 0.6 ? 'var(--orange)' : 'var(--red)';
    return `<div class="an-value-bar-wrap">
      <div class="an-value-bar-bg"><div class="an-value-bar-fill" style="width:${pct.toFixed(1)}%;background:${color}"></div></div>
      <div class="an-value-lbl" style="color:${color}">${(v*100).toFixed(0)}</div>
    </div>`;
  }

  function statsHtml(analytics, isSwapper) {
    const { qualifyingWars, participationRate, avgDecksPerWar, avgFamePerWar, avgFamePerBattle, consistency } = analytics;
    if (!qualifyingWars) return '';
    const fmt = (n, d=0) => isFinite(n) ? n.toFixed(d) : '—';
    const pct = (n) => isFinite(n) ? (n*100).toFixed(0)+'%' : '—';

    const fb = clanDecksAvg > 0 ? clanFameAvg / clanDecksAvg : 1;

    const fameBattleColor = avgFamePerBattle >= fb * 1.15 ? '#26c281'
      : avgFamePerBattle >= fb * 0.95 ? '#7ecf5a'
      : avgFamePerBattle >= fb * 0.75 ? 'var(--gold)'
      : avgFamePerBattle >= fb * 0.50 ? 'var(--orange)'
      : 'var(--red)';

    const warsColor = qualifyingWars >= 15 ? '#d4a017'
      : qualifyingWars >= 10 ? '#8a96a8'
      : qualifyingWars >= 5  ? '#a0522d'
      : 'var(--text-dim)';

    const stat = (val, color, label) =>
      `<div class="an-stat"><div class="an-stat-val" style="color:${color}">${val}</div><div class="an-stat-lbl">${label}</div></div>`;

    // Swappers: only fame/battle efficiency and longevity matter
    if (isSwapper) {
      return `<div class="an-stats" style="grid-template-columns:repeat(2,1fr)">
        ${stat(fmt(avgFamePerBattle,0), fameBattleColor, 'Fame/Battle')}
        ${stat(qualifyingWars,          warsColor,       'Wars Rated')}
      </div>`;
    }

    const partColor = participationRate >= 0.90 ? '#26c281'
      : participationRate >= 0.75 ? '#7ecf5a'
      : participationRate >= 0.60 ? 'var(--gold)'
      : participationRate >= 0.40 ? 'var(--orange)'
      : 'var(--red)';

    const decksColor = avgDecksPerWar >= 15 ? '#26c281'
      : avgDecksPerWar >= 13 ? '#7ecf5a'
      : avgDecksPerWar >= 10 ? 'var(--gold)'
      : avgDecksPerWar >= 6  ? 'var(--orange)'
      : 'var(--red)';

    const fameWarColor = avgFamePerWar >= clanFameAvg * 1.15 ? '#26c281'
      : avgFamePerWar >= clanFameAvg * 0.95 ? '#7ecf5a'
      : avgFamePerWar >= clanFameAvg * 0.75 ? 'var(--gold)'
      : avgFamePerWar >= clanFameAvg * 0.50 ? 'var(--orange)'
      : 'var(--red)';

    const consistColor = consistency >= 0.85 ? '#26c281'
      : consistency >= 0.70 ? '#7ecf5a'
      : consistency >= 0.55 ? 'var(--gold)'
      : consistency >= 0.40 ? 'var(--orange)'
      : 'var(--red)';

    return `<div class="an-stats">
      ${stat(pct(participationRate),  partColor,       'Participation')}
      ${stat(fmt(avgDecksPerWar,1),   decksColor,      'Decks/War')}
      ${stat(fmt(avgFamePerWar,0),    fameWarColor,    'Fame/War')}
      ${stat(fmt(avgFamePerBattle,0), fameBattleColor, 'Fame/Battle')}
      ${stat(pct(consistency),        consistColor,    'Consistency')}
      ${stat(qualifyingWars,          warsColor,       'Wars Rated')}
    </div>`;
  }

  function buildCard(entry, rank, isSwap = false, inClan = false) {
    const { p, analytics, signal } = entry;
    const roleClass = posClass(p.pos || 'Member');
    const qw = analytics.qualifyingWars || 0;
    const vetClass = qw >= 15 ? 'vet-gold' : qw >= 10 ? 'vet-silver' : qw >= 5 ? 'vet-bronze' : '';
    const sigHtml = isSwap
      ? `<div class="an-signal an-signal-swapper" title="Swapper account — not ranked">SW</div>`
      : signalHtml(signal, analytics, p);
    const alertDot = (!isSwap && signal && signal.alert)
      ? `<span class="an-alert-dot an-alert-${signal.alert}" title="${signal.tooltip}"></span>`
      : '';
    const inClanDot = isSwap
      ? `<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${inClan ? 'var(--green)' : 'rgba(120,120,120,0.4)'};margin-left:6px;vertical-align:middle;box-shadow:${inClan ? '0 0 5px rgba(38,194,129,0.7)' : 'none'}" title="${inClan ? 'Currently in clan' : 'Not in clan'}"></span>`
      : '';
    const warsNote = analytics.qualifyingWars > 0
      ? `<div class="an-wars-lbl">${analytics.totalWarsSinceJoining} wars as member</div>` : '';
    return `<div class="an-card ${vetClass}">
      <div class="an-card-top">
        ${isSwap ? '' : `<div class="an-rank">${rank}</div>`}
        <span class="pos-badge ${roleClass}">${p.pos || 'Member'}</span>
        <div class="an-name">${p.name}${playerTagHtml(playerTag(p), 'dot')}${inClanDot}${alertDot}</div>
        ${sigHtml}
      </div>
      ${valueBarHtml(analytics, isSwap)}
      ${statsHtml(analytics, isSwap)}
      ${warsNote}
    </div>`;
  }

  const sectionHdr = (label, color, count) =>
    `<div class="analysis-section-hdr" style="background:${color}">${label} <span style="font-family:'Share Tech Mono',monospace;font-size:10px;opacity:0.7;font-weight:400">${count} members</span></div>`;

  let html = '';

  // Clan avg reference bar
  html += `<div style="display:flex;gap:16px;align-items:center;padding:10px 4px 16px;flex-wrap:wrap">
    <span style="font-family:'Share Tech Mono',monospace;font-size:10px;color:rgba(255,255,255,0.55);letter-spacing:1px;text-transform:uppercase">Clan baselines (all-time, participants only):</span>
    <span style="font-family:'Orbitron',monospace;font-size:11px;font-weight:700;color:var(--gold)">Avg fame/war: ${Math.round(clanFameAvg).toLocaleString()}</span>
    <span style="font-family:'Orbitron',monospace;font-size:11px;font-weight:700;color:var(--gold)">Avg decks/war: ${clanDecksAvg.toFixed(1)}</span>
    <span style="font-family:'Orbitron',monospace;font-size:11px;font-weight:700;color:var(--gold)">Fame/battle: ${Math.round(fameBattleAvg)}</span>
    <span style="font-family:'Share Tech Mono',monospace;font-size:9px;color:rgba(255,255,255,0.4)">Value bar: 100=clan avg · green=above · red=below</span>
  </div>`;

  const searchLower = searchStr.toLowerCase();
  const filteredMain = searchStr
    ? mainWithAnalytics.filter(e => e.p.name.toLowerCase().includes(searchLower))
    : mainWithAnalytics;
  const filteredSwappers = searchStr
    ? swapperWithAnalytics.filter(e => e.p.name.toLowerCase().includes(searchLower))
    : swapperWithAnalytics;

  // Main section (non-swapper members)
  if (filteredMain.length) {
    const sectionColor = analysisFilter === 'active' ? 'var(--purple)' : 'rgba(90,104,128,0.6)';
    const sectionLabel = analysisFilter === 'active' ? 'Active Members' : 'Inactive / Former';
    html += sectionHdr(sectionLabel, sectionColor, filteredMain.length);
    html += `<div class="analysis-grid">`;
    filteredMain.forEach((entry, i) => { html += buildCard(entry, i+1, false); });
    html += `</div>`;
  }

  // Swapper section — always shown (all known swapper accounts)
  if (filteredSwappers.length) {
    html += sectionHdr('Swapper Accounts', 'linear-gradient(90deg,rgba(123,84,192,0.8),rgba(123,84,192,0.5))', filteredSwappers.length);
    html += `<div style="font-family:'Share Tech Mono',monospace;font-size:10px;color:rgba(255,255,255,0.5);margin-bottom:10px;padding:0 4px">
      All known swapper accounts · exempt from ranking · stats shown for reference
    </div>`;
    html += `<div class="analysis-grid">`;
    filteredSwappers.forEach(entry => {
      // Pass inClan status so buildCard can show the indicator
      html += buildCard({ ...entry, signal: null }, 0, true, entry.inClan);
    });
    html += `</div>`;
  }

  if (!filteredMain.length && !filteredSwappers.length) {
    html += `<div style="text-align:center;padding:60px;font-family:'Share Tech Mono',monospace;color:var(--text-dim);letter-spacing:2px">NO PLAYER DATA</div>`;
  }

  document.getElementById('main').innerHTML = html;
}

function setAnalysisFilter(f) {
  analysisFilter = f;
  document.getElementById('an-active-btn').classList.toggle('active', f === 'active');
  document.getElementById('an-inactive-btn').classList.toggle('active', f === 'inactive');
  render();
}
function toggleInactive() { showInactive = !showInactive; render(); }
function onSearch(v) { searchStr = v; render(); }

async function refreshAll() {
  document.getElementById('st-sheet').className = 's-loading';
  document.getElementById('st-sheet').textContent = 'Refreshing...';
  document.getElementById('st-api').className = 's-loading';
  document.getElementById('st-api').textContent = 'Refreshing...';
  await loadAll(false);
}

function setGMetric(m) {
  graphicMetric = m;
  const groups = document.querySelectorAll('#grp-graphic .btn-group');
  if (groups[0]) groups[0].querySelectorAll('.btn').forEach((b, i) =>
    b.classList.toggle('active', ['personal', 'clan'][i] === m));

function setGSort(s) {
  graphicSort = s;
  const groups = document.querySelectorAll('#grp-graphic .btn-group');
  if (groups[1]) groups[1].querySelectorAll('.btn').forEach((b, i) =>
    b.classList.toggle('active', ['avg', 'alpha'][i] === s));
  if (mode === 'graphic') renderGraphic();
}

// ══════════════════════════════════════════════════════
//  LOAD
// ══════════════════════════════════════════════════════
async function loadAll(showLoader = true) {
  // 1. Sheets (v2 long-format schema: WARS / WAR_PLAYERS / STANDINGS / SNAPSHOTS)
  try {
    setLoader(20, 'FETCHING WAR RECORDS...');
    const [warsCSV, warPlayersCSV, standingsCSV, snapshotsCSV, swappersCSV] = await Promise.all([
      fetchCSV(WARS_URL), fetchCSV(WAR_PLAYERS_URL), fetchCSV(STANDINGS_URL), fetchCSV(SNAPSHOTS_URL),
      fetchCSV(SWAPPERS_URL).catch(() => null)  // graceful — tab may not exist yet
    ]);
    if (!warsCSV) throw new Error('WARS sheet returned no data');
    const warsList = parseWarsSheet(warsCSV);
    const hist = buildHistory(warsList, warPlayersCSV || []);
    WARS    = hist.wars;
    PLAYERS = hist.players;
    LIVE_SHEET_DATA = snapshotsCSV ? buildLiveFromSnapshots(snapshotsCSV) : {};
    WAR_STANDINGS   = standingsCSV ? parseStandingsSheet(standingsCSV) : {};
    // Parse swapper overrides — one player name per row, first column
    SWAPPER_NAMES = new Set();
    if (swappersCSV && swappersCSV.length > 1) {
      swappersCSV.slice(1).forEach(row => {
        const name = (row[0] || '').trim().toLowerCase();
        if (name) SWAPPER_NAMES.add(name);
      });
    }

    ALL_SCORES_FLAT.length = 0;
    PLAYERS.forEach(p => p.scores.forEach(s => { if (s !== null && s > 0) ALL_SCORES_FLAT.push(s); }));

    document.getElementById('st-sheet').className = 's-ok';
    document.getElementById('st-sheet').textContent = `${WARS.length} wars — ${PLAYERS.length} players`;
  } catch(e) {
    document.getElementById('st-sheet').className = 's-err';
    document.getElementById('st-sheet').textContent = 'Sheet error: ' + e.message;
    console.error(e);
  }

  // 2. CR API — clan members (roles) + live war (fame)
  setLoader(60, 'CONNECTING TO CLASH ROYALE API...');
  try {
    const { members, race } = await fetchClanData();
    LIVE_ROLES = members ? parseClanMembers(members) : {};
    LIVE_DATA  = race    ? parseLiveWar(race)         : {};
    LIVE_RACE_CLANS = race ? parseRaceClans(race) : [];

    // Append the live in-progress war as a column (visibility gated by the
    // "include live" toggle via effectiveWars()). Must run after PLAYERS/WARS
    // are built and LIVE_DATA is populated.
    appendLiveColumn();

    // Overwrite positions for current clan members
    for (const p of PLAYERS) {
      const key = p.name.toLowerCase().trim();
      if (LIVE_ROLES[key]) p.pos = LIVE_ROLES[key];
      // Swapper override: always applied after API role assignment
      if (SWAPPER_NAMES.has(key)) p.pos = 'Swapper';
    }

    const roleCount = Object.keys(LIVE_ROLES).length;
    const fameCount = Object.keys(LIVE_DATA).length;
    document.getElementById('st-api').className = 's-ok';
    document.getElementById('st-api').textContent = `${roleCount} members synced — ${fameCount} in live war`;
  } catch(e) {
    LIVE_DATA  = {};
    LIVE_ROLES = {};
    document.getElementById('st-api').className = 's-err';
    document.getElementById('st-api').textContent = 'CR API unavailable';
    console.warn('CR API:', e);
  }

  setLoader(90, 'RENDERING...');
  try {
    render();
  } catch(e) {
    console.error('render() threw:', e);
    setLoader(100, 'ERROR: ' + e.message);
    const main = document.getElementById('main');
    if (main) main.innerHTML =
      `<div style="padding:40px;font-family:monospace;color:#e05252;font-size:13px">
        <b>Render error:</b> ${e.message}<br><br>
        <pre style="white-space:pre-wrap;font-size:11px;color:#aab3c4">${e.stack}</pre>
      </div>`;
    hideLoader();
    return;
  }
  setLoader(100, 'READY');
  if (showLoader) setTimeout(hideLoader, 400);
}
